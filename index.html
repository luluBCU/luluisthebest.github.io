<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Arcade</title>
    <style>
        /* Clean Theme Styled After Unblocked/Proxy Arcade Dashboards */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #161b22;
            width: 100%;
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        h1 {
            color: #58a6ff;
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        header p {
            color: #8b949e;
            margin: 0;
            font-size: 1.1rem;
        }
        .arcade-container {
            max-width: 1200px;
            width: 90%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            padding: 40px 0;
        }
        .game-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15);
        }
        .game-details {
            padding: 20px;
        }
        .game-title {
            color: #f0f6fc;
            font-size: 1.3rem;
            margin: 0 0 10px 0;
        }
        .game-description {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0;
        }
        .play-btn {
            display: block;
            background-color: #21262d;
            color: #58a6ff;
            text-align: center;
            padding: 12px 0;
            text-decoration: none;
            font-weight: 600;
            border-top: 1px solid #30363d;
            transition: background-color 0.2s, color 0.2s;
        }
        .game-card:hover .play-btn {
            background-color: #58a6ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 GITHUB ARCADE HUB</h1>
        <p>Instant Browser Gaming Portal</p>
    </header>

    <!-- This is where your games will automatically populate -->
    <div class="arcade-container" id="arcadeGrid"></div>

    <script>
        // ==========================================
        //  ✏️ CUSTOMIZE YOUR GAMES LIST HERE
        // ==========================================
        // To add a new game, just add a comma after the last item 
        // and copy/paste another block matching the exact format.
        
        const GAMES_LIST = [
            {
                name: "2048",
                fileName: "2048.html",
                description: "hi"
            }
        ];
        const grid = document.getElementById("arcadeGrid");

        GAMES_LIST.forEach(game => {
            const card = document.createElement("div");
            card.className = "game-card";

            card.innerHTML = `
                <div class="game-details">
                    <h2 class="game-title">${game.name}</h2>
                    <p class="game-description">${game.description}</p>
                </div>
                <a href="./games/${game.fileName}" class="play-btn">Launch Game</a>
            `;

            grid.appendChild(card);
        });
    </script>

</body>
</html>
