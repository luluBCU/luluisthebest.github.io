<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Arcade</title>
    <style>
        body {
            background-color: #111;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        h1 { font-size: 3rem; text-shadow: 0 0 10px #0f0; }
        .arcade-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .game-card {
            background-color: #222;
            border: 3px solid #0f0;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
        }
        .game-card h3 { color: #fff; margin-top: 0; }
        .play-btn {
            display: inline-block;
            background-color: #0f0;
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🕹️ MY GITHUB ARCADE 🕹️</h1>
    <p>Select a game below to start playing directly in your browser!</p>

    <div class="arcade-container">
        <!-- Game 1 Card -->
        <div class="game-card">
            <h3>Retro Snake</h3>
            <p>Eat the food, grow bigger, and don't hit the walls!</p>
            <a href="./games/snake.html" class="play-btn">PLAY NOW</a>
        </div>

        <!-- Game 2 Card -->
        <div class="game-card">
            <h3>Space Invaders</h3>
            <p>Defend the universe from rows of alien attacks.</p>
            <a href="./games/space-invaders.html" class="play-btn">PLAY NOW</a>
        </div>
    </div>

</body>
</html>
